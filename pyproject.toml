[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "r6tracker"
version = "1.0.0"
description = "Tracks a Rainbow Six Siege player's matches, rank, K/D and operators, with a Discord bot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "discord.py>=2.6",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
    "tzdata",  # time zones on Windows
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
r6tracker = "r6tracker.cli:main"

[tool.setuptools.packages.find]
include = ["r6tracker*"]

[tool.setuptools.package-data]
r6tracker = ["data/*.json", "data/*.txt", "data/icons/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
